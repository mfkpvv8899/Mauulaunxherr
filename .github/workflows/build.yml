name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # AQUI ESTÁ A CORREÇÃO: Define a pasta onde o Gradle deve rodar
        working-directory: ./app 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # O comando abaixo vai rodar dentro de ./app agora
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MeuLauncher-apk
          # Como o comando rodou dentro de ./app, o caminho do APK muda:
          path: app/build/outputs/apk/debug/app-debug.apk
